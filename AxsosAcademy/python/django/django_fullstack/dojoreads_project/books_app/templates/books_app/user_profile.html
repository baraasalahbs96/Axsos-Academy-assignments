<!DOCTYPE html>
<html>
<head>
    <title>User Reviews</title>
    {% load static %}
</head>
<body>

<p>
    <a href="/books/">Home</a> |
    <a href="/books/add/">Add Book and Review</a> |
    <a href="/logout/">Logout</a>
</p>

<h2>User Alias: {{ profile_user.alias }}</h2>
<p>Name: {{ profile_user.name }}</p>
<p>Email: {{ profile_user.email }}</p>
<p>Total Reviews: {{ total_reviews }}</p>

<h3>Posted Reviews on the following books:</h3>
{% for book in reviewed_books %}
    <p><a href="/books/{{ book.id }}/">{{ book.title }}</a></p>
{% endfor %}

</body>
</html>
