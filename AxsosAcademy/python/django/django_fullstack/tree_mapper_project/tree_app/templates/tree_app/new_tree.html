{% extends "tree_app/base.html" %}
{% block content %}

<div class="row">
    <div class="col-md-7">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h4>Add a Tree to the Map</h4>
                </div>
                <div class="panel-body">
                    {% if messages %}
                    <div>
                        <ul >
                            {% for msg in messages %}
                            <li>{{ msg }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    {% endif %}
                    <p> Species must not be blank</p>
                    <form method="post" action="{% url 'create_tree' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label> Species</label>
                            <input type="text" name="species" class="form-control"> 
                            </div>
                            <div class="form-group">
                            <label> Location</label>
                            <input type="text" name="location" class="form-control" value="Miliani Ravine Park"> 
                            </div>
                            <div class="form-group">
                            <label> Data Found</label>
                            <input type="date" name="data_found" class="form-control" value=" 5/15/2024"> 
                            </div>
                            <div class="form-group">
                            <label> Zip code</label>
                            <input type="text" name="zip_code" class="form-control" maxlength="5"> 
                            </div>
                            <div class="form-group">
                            <label> Notes</label>
                            <textarea name="notes" class="form-control"> Near the bathrooms, you can tell by the umbrella shape and height its a Monkeypod tree </textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Tree</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
