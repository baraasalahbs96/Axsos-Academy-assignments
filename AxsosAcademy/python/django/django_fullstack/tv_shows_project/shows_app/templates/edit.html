<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Edit {{ show.title }}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="container">
    <a href="/shows/{{ show.id }}/">Go to Show</a>
    <h1>Edit Show {{ show.id }}</h1>
    <form action="/shows/{{ show.id }}/update/" method="POST">
        {% csrf_token %}
        <label>Title:</label>
        <input type="text" name="title" value="{{ show.title }}"><br>
        <label>Network:</label>
        <input type="text" name="network" value="{{ show.network }}"><br>
        <label>Release Date:</label>
        <input type="date" name="release_date" value="{{ show.release_date | date:'Y-m-d' }}"><br>
        <label>Description:</label>
        <textarea name="description">{{ show.description }}</textarea><br>
        <button type="submit">Update</button>
    </form>
    <br>
    <a href="/shows/{{ show.id }}/">Go to Show</a>
</div>
</body>
</html>
