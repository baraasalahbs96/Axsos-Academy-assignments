{% extends 'main_app/base.html' %}
{% block content %}

<h2>Edit profile</h2>

{% if messages %}
    {% for msg in messages %}
        <div class="alert alert-danger">{{ msg }}</div>
    {% endfor %}
{% endif %}

<div class="row">
<div class="col-md-5">
<fieldset>
<legend>Edit Information</legend>
<form action="/users/update/" method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label>Email Address:</label>
        <input type="email" name="email" value="{{ user.email }}" class="form-control">
    </div>
    <div class="form-group">
        <label>First Name:</label>
        <input type="text" name="first_name" value="{{ user.first_name }}" class="form-control">
    </div>
    <div class="form-group">
        <label>Last Name:</label>
        <input type="text" name="last_name" value="{{ user.last_name }}" class="form-control">
    </div>
    <button class="btn btn-success">Save</button>
</form>
</fieldset>
</div>

<div class="col-md-5">
<fieldset>
<legend>Change Password</legend>
<form action="/users/update_pw/" method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label>Password:</label>
        <input type="password" name="password" class="form-control">
    </div>
    <div class="form-group">
        <label>Password Confirmation:</label>
        <input type="password" name="confirm_pw" class="form-control">
    </div>
    <button class="btn btn-success">Update Password</button>
</form>
</fieldset>
</div>
</div>

<br>
<fieldset>
<legend>Edit Description</legend>
<form action="/users/update_desc/" method="POST">
    {% csrf_token %}
    <textarea name="description" class="form-control" rows="4">{{ user.description }}</textarea>
    <br>
    <button class="btn btn-success">Save</button>
</form>
</fieldset>

{% endblock %}
