{% extends 'main_app/base.html' %}
{% block content %}

<h2>Register</h2>
<form action="/register/submit/" method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label>Email Address:</label>
        <input type="email" name="email" class="form-control" style="width:250px;">
    </div>
    <div class="form-group">
        <label>First Name:</label>
        <input type="text" name="first_name" class="form-control" style="width:250px;">
    </div>
    <div class="form-group">
        <label>Last Name:</label>
        <input type="text" name="last_name" class="form-control" style="width:250px;">
    </div>
    <div class="form-group">
        <label>Password:</label>
        <input type="password" name="password" class="form-control" style="width:250px;">
    </div>
    <div class="form-group">
        <label>Password Confirmation:</label>
        <input type="password" name="confirm_pw" class="form-control" style="width:250px;">
    </div>
    <button class="btn btn-success">Register</button>
</form>
<br>
<a href="/signin/">Already have an account? Login</a>

{% endblock %}
