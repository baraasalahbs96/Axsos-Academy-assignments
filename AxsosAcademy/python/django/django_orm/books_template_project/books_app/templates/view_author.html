<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>{{ author.first_name }} {{ author.last_name }}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="container">
    <a href="/">← Back</a>
    <h2>ID: {{ author.id }}</h2>
    <p><strong>Notes:</strong> {{ author.notes }}</p>

    <h3>Books</h3>
    <ul>
        {% for book in author.books.all %}
            <li>{{ book.title }}</li>
        {% endfor %}
    </ul>

    <form action="/authors/{{ author.id }}/add_book/" method="POST">
        {% csrf_token %}
        <select name="book_id">
            {% for book in other_books %}
                <option value="{{ book.id }}">{{ book.title }}</option>
            {% endfor %}
        </select>
        <button type="submit">Add</button>
    </form>
</div>
</body>
</html>
