<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container counter-container mt-5">
    <h1 class="mb-4">Counter</h1>
    <div class="alert alert-info">
        <h2>Page Visits: {{ session['visits'] }}</h2>
        <h2>Counter Value: {{ session['counter'] }}</h2>
    </div>

    <div class="d-flex gap-2 mt-4">
        <form action="/add_two" method="post">
            <button type="submit" class="btn btn-primary">+2</button>
        </form>

        <form action="/increment_custom" method="post" class="d-flex gap-1">
            <input type="number" name="increment" class="form-control" placeholder="Number" required>
            <button type="submit" class="btn btn-success">Increase</button>
        </form>

        <form action="/reset" method="post">
            <button type="submit" class="btn btn-warning">Reset</button>
        </form>
    </div>

    <hr>
    <form action="/destroy_session" method="post">
    <button type="submit" class="btn btn-danger">Destroy Session</button>
    </form>
</div>

</body>
</html>
