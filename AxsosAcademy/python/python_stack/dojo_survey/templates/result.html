<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Submitted Info</title>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 shadow rounded">
        <h2>Submitted Info</h2>
        <p><strong>Name:</strong> {{ survey_data.name }}</p>
        <p><strong>Location:</strong> {{ survey_data.location }}</p>
        <p><strong>Language:</strong> {{ survey_data.language }}</p>
        <p><strong>Interests:</strong> {{ survey_data.interests | join(', ') }}</p>
        <p><strong>Comment:</strong> {{ survey_data.comments }}</p>
        <a href="/" class="btn btn-secondary">Go Back</a>
    </div>
</body>
</html>
